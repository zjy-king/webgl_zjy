<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760">
  <style>
    .bg     { fill: #12151c; }
    .card   { fill: #1b2029; stroke: #2e3746; stroke-width: 1.5; }
    .ttl    { fill: #e8edf5; font: 700 17px "Noto Serif CJK SC", sans-serif; }
    .h      { fill: #e8edf5; font: 700 15px "Noto Serif CJK SC", sans-serif; }
    .sub    { fill: #8b98ab; font: 12.5px "Noto Serif CJK SC", sans-serif; }
    .body   { fill: #b9c4d4; font: 13px "Noto Serif CJK SC", sans-serif; }
    .code   { fill: #7fd4a0; font: 12px "DejaVu Sans Mono", monospace; }
    .warn   { fill: #ffb454; font: 12.5px "Noto Serif CJK SC", sans-serif; }
    .ln     { stroke: #4d9fd6; stroke-width: 2.2; fill: none; marker-end: url(#ah); }
    .dash   { stroke: #3a4455; stroke-width: 1.5; stroke-dasharray: 5 5; fill: none; }
  </style>
  <defs>
    <marker id="ah" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#4d9fd6"/>
    </marker>
  </defs>

  <rect class="bg" width="1200" height="760"/>
  <text x="30" y="42" class="ttl">阴影贴图：两遍渲染</text>
  <text x="30" y="66" class="sub">教材 Ch8.8 · 第一遍从光源看场景记深度，第二遍从相机看场景比深度</text>

  <!-- ==================== 第一遍 ==================== -->
  <rect class="card" x="28" y="92" width="556" height="330" rx="10"/>
  <text x="48" y="122" class="h">第一遍 · 光源视角 → 深度图</text>
  <text x="48" y="146" class="code">gl.bindFramebuffer(shadowFBO.fbo)</text>

  <!-- 光源 -->
  <g transform="translate(84,196)">
    <circle cx="0" cy="0" r="14" fill="#ffd86b"/>
    <g stroke="#ffd86b" stroke-width="2">
      <line x1="0" y1="-22" x2="0" y2="-30"/><line x1="0" y1="22" x2="0" y2="30"/>
      <line x1="-22" y1="0" x2="-30" y2="0"/><line x1="22" y1="0" x2="30" y2="0"/>
      <line x1="-16" y1="-16" x2="-21" y2="-21"/><line x1="16" y1="16" x2="21" y2="21"/>
    </g>
    <text x="-20" y="48" class="sub">方向光</text>
  </g>

  <!-- 物体 -->
  <g transform="translate(238,182)">
    <rect x="0" y="0" width="52" height="34" fill="#8b5a2b" stroke="#b3763a"/>
    <rect x="16" y="40" width="20" height="66" fill="#6d4520" stroke="#8a5a28"/>
    <text x="-14" y="126" class="sub">场景物体</text>
  </g>

  <!-- 光锥 -->
  <path class="dash" d="M104,190 L232,200 M104,204 L232,240"/>
  <text x="118" y="182" class="sub" font-size="11">正交视锥</text>

  <!-- 深度图 -->
  <g transform="translate(356,166)">
    <rect x="0" y="0" width="150" height="150" fill="#0e1218" stroke="#5d6d84"/>
    <rect x="42" y="56" width="42" height="26" fill="#cfd8e4"/>
    <rect x="58" y="84" width="16" height="48" fill="#9aa8ba"/>
    <rect x="0" y="132" width="150" height="18" fill="#7a8a9e"/>
    <text x="4" y="14" class="code" font-size="10" fill="#8b98ab">depthMap</text>
    <text x="0" y="172" class="sub" font-size="11">每个纹素 = 该方向上离光源最近的深度</text>
  </g>

  <line class="ln" x1="276" y1="222" x2="350" y2="236"/>

  <text x="48" y="356" class="body">· FBO 只挂深度纹理，不挂颜色附件</text>
  <text x="48" y="378" class="code">  DEPTH_COMPONENT32F + COMPARE_REF_TO_TEXTURE</text>
  <text x="48" y="402" class="warn">· 剔除【正面】cullFace(FRONT)：把深度整体往后推一点，</text>
  <text x="48" y="422" class="warn">  是一种常见的抗 acne 技巧，效果等价于把 bias 做进几何里</text>

  <!-- ==================== 第二遍 ==================== -->
  <rect class="card" x="616" y="92" width="556" height="330" rx="10"/>
  <text x="636" y="122" class="h">第二遍 · 相机视角 → 比较深度</text>
  <text x="636" y="146" class="code">float shadowFactor()</text>

  <!-- 相机 -->
  <g transform="translate(660,230)">
    <polygon points="0,0 24,-13 24,13" fill="#7fd4a0"/>
    <text x="-12" y="34" class="sub">相机</text>
  </g>

  <!-- 表面 -->
  <g transform="translate(744,258)">
    <rect x="0" y="0" width="130" height="10" fill="#b3763a" stroke="#8a5a28"/>
    <text x="40" y="34" class="sub">着色点 P</text>
    <line x1="65" y1="0" x2="65" y2="-62" stroke="#4d9fd6" stroke-width="2" marker-end="url(#ah)"/>
    <text x="72" y="-44" class="code" font-size="11">to light</text>
  </g>

  <!-- 深度比较框 -->
  <g transform="translate(916,180)">
    <rect x="0" y="0" width="230" height="128" rx="8" fill="#151a22" stroke="#2e3746"/>
    <text x="14" y="26" class="code" font-size="11">z = fragDepth</text>
    <text x="14" y="48" class="code" font-size="11">d = depthMap[u, v]</text>
    <line x1="14" y1="60" x2="216" y2="60" stroke="#2e3746"/>
    <text x="14" y="84" class="code" font-size="11" fill="#7fd4a0">z &lt;= d + bias  →  LIT</text>
    <text x="14" y="108" class="code" font-size="11" fill="#ff8b8b">z &gt;  d + bias  →  SHADOW</text>
  </g>

  <text x="636" y="356" class="body">· u,v 由 lightVP 变换后归一化得到；z 是同一变换下的深度</text>
  <text x="636" y="378" class="warn">· 超出光源视锥的片元直接按「有光」处理，避免边缘误判</text>
  <text x="636" y="402" class="body">· 开启 PCF 时对 3×3 邻域各查一次取平均，边缘变软</text>

  <!-- ==================== 下半 ==================== -->
  <rect class="card" x="28" y="446" width="556" height="284" rx="10"/>
  <text x="48" y="476" class="h">关键细节 · 变换空间要对齐</text>
  <text x="48" y="504" class="body">主着色器拿到的是 vPosVS（视图空间），</text>
  <text x="48" y="526" class="body">而光源矩阵天然作用在世界空间，所以要预先把 view 的逆乘进去：</text>

  <rect x="48" y="542" width="500" height="58" rx="8" fill="#151a22" stroke="#2e3746"/>
  <text x="66" y="566" class="code">lightVP_view = lightVP_world · inverse(view)</text>
  <text x="66" y="588" class="code" font-size="11" fill="#8b98ab">→ lightVP_view * vPosVS ≡ lightVP_world * worldPos</text>

  <text x="48" y="628" class="warn">漏掉这一步的典型症状：阴影整体偏移、旋转，或者完全消失。</text>
  <text x="48" y="656" class="body">本项目在 Shadow.buildLightVPForVS() 里完成这步，</text>
  <text x="48" y="678" class="body">并用「lightVPForVS(view·p) 与 lightVPWorld(p) 误差 &lt; 1e-15」做过校验。</text>

  <rect class="card" x="616" y="446" width="556" height="284" rx="10"/>
  <text x="636" y="476" class="h">两个面板参数决定阴影质量</text>

  <text x="636" y="510" class="code" font-size="12.5">mapSize</text>
  <text x="636" y="532" class="body">阴影图分辨率。越小 → 阴影边缘锯齿越明显。</text>
  <text x="636" y="552" class="sub">面板给了 256 / 512 / 1024 / 2048 四档对比。</text>

  <text x="636" y="586" class="code" font-size="12.5">bias</text>
  <text x="636" y="608" class="body">深度偏移。太小 → 表面出现条纹状自遮挡（acne）；</text>
  <text x="636" y="630" class="body">太大 → 阴影与物体脱离，出现「漏光」（peter-panning）。</text>

  <text x="636" y="664" class="code" font-size="12.5">PCF</text>
  <text x="636" y="686" class="body">开 = 3×3 采样取平均（软边）；关 = 单点采样（硬边锯齿）。</text>
</svg>
